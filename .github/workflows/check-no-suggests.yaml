# Reusable no-suggests check (CRAN packages): R CMD check with only hard dependencies
# (Depends/Imports/LinkingTo), plus testthat/knitr/rmarkdown. Cache disabled so a cached
# Suggests dependency can't leak in. Callers must use `secrets: inherit`.
# private=true runs with PRIVATE_ACTIONS_PAT so private dependencies resolve.

name: check-no-suggests

on:
  workflow_call:
    inputs:
      private:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-no-suggests:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ inputs.private && secrets.PRIVATE_ACTIONS_PAT || secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          dependencies: '"hard"'
          cache: false
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
          needs: check

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
