# Reusable pkgdown build + deploy to gh-pages. Callers must use `secrets: inherit`.
# private=true runs with PRIVATE_ACTIONS_PAT so private dependencies resolve.
# cmdstan=true installs the CmdStan toolchain so articles that fit Stan models via
# cmdstanr (e.g. through smbr2) can compile and sample during the site build.
# cmdstanr itself must arrive through the package's dependency tree.
# deploy=false builds without deploying on any event (used by the canary callers).

name: pkgdown

on:
  workflow_call:
    inputs:
      cmdstan:
        type: boolean
        default: false
      private:
        type: boolean
        default: false
      deploy:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ (github.event_name != 'pull_request' && inputs.deploy) || github.run_id }}
    env:
      GITHUB_PAT: ${{ inputs.private && secrets.PRIVATE_ACTIONS_PAT || secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Install CmdStan
        if: ${{ inputs.cmdstan }}
        run: |
          cmdstanr::check_cmdstan_toolchain(fix = TRUE, quiet = TRUE)
          cmdstanr::install_cmdstan(cores = 2, quiet = TRUE)
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request' && inputs.deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
